<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="230" r="140" fill="#3b82f6" opacity="0.12" filter="blur(40px)"/>

  <!-- Logo M Mark with Accent -->
  <g filter="url(#shadow)">
    <path d="M140 356 V180 L220 286 C238 310 274 310 292 286 L372 180 V356" 
          fill="none" 
          stroke="url(#mGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Financial Sparkle / Indicator Dot -->
    <circle cx="372" cy="156" r="22" fill="#10b981"/>
  </g>
</svg>
